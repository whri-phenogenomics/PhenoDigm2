[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "phenodigm2"
version = "0.1.0"
description = "Build phenotype annotation databases and compute PhenoDigm2 scores"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.32.3",
    "pydantic>2.10",
    "pyyaml>6.0",
    "requests>=2.32.5",
]

[project.scripts]
phenodigm2 = "phenodigm2.cli:main"
phenodigm = "phenodigm2.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.3.0",
]

# Flat (non-src) layout: the import package is the root-level phenodigm2/ directory.
[tool.uv.build-backend]
module-name = "phenodigm2"
module-root = ""
